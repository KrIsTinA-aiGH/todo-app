plugins {
    id 'maven-publish'
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '8.3.10'
}

group = 'org.example'
version = findProperty('version') ?: '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'org.example.TodoApp'
}

test {
    useJUnitPlatform()
}

tasks.named('shadowJar') {
    archiveBaseName.set('todo-app')
    archiveClassifier.set('')
    archiveVersion.set(project.version.toString())
    mergeServiceFiles()

    manifest {
        attributes 'Main-Class': 'org.example.TodoApp'
    }
}

tasks.named('jar') {
    enabled = false
}

tasks.named('distZip') {
    dependsOn tasks.named('shadowJar')
}

tasks.named('distTar') {
    dependsOn tasks.named('shadowJar')
}

tasks.named('startScripts') {
    dependsOn tasks.named('shadowJar')
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}
publishing {
    publications {
        shadow(MavenPublication) {
            groupId = project.group.toString()
            artifactId = 'todo-app'
            version = project.version.toString()

            artifact(tasks.named('shadowJar'))
        }
    }

    repositories {
        maven {
            name = 'GitHubPackages'

            def repositoryName = System.getenv('GITHUB_REPOSITORY')
                    ?.toLowerCase()

            url = uri(
                    "https://maven.pkg.github.com/${repositoryName ?: 'OWNER/REPOSITORY'}"
            )

            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
}